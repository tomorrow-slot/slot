<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>明日のあなたに必要なものスロット</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&family=Zen+Marugothic:wght@400;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --orange1: #FF8C00; --deep: #7a3500; }

body {
  min-height: 100vh;
  background: linear-gradient(135deg, #FF7200 0%, #FFB347 45%, #FFE066 80%, #FF9500 100%);
  font-family: 'M PLUS Rounded 1c', 'Zen Marugothic', sans-serif;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  overflow: hidden; position: relative;
}

.bg-circles { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
.bg-circle { position: absolute; border-radius: 50%; opacity: 0.13; animation: floatBg 9s ease-in-out infinite; }
.bg-circle:nth-child(1){width:320px;height:320px;background:#fff;top:-100px;left:-100px;animation-delay:0s;}
.bg-circle:nth-child(2){width:180px;height:180px;background:#FF4500;top:65%;right:-50px;animation-delay:2.5s;}
.bg-circle:nth-child(3){width:140px;height:140px;background:#FFE500;bottom:-30px;left:15%;animation-delay:5s;}
.bg-circle:nth-child(4){width:90px;height:90px;background:#fff;top:25%;left:3%;animation-delay:1.5s;}
.bg-circle:nth-child(5){width:70px;height:70px;background:#FF6347;top:8%;right:8%;animation-delay:3.5s;}
@keyframes floatBg{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-18px) scale(1.04);}}

.container {
  position: relative; z-index: 1;
  display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 20px;
}

/* ---- タイトル（影なし） ---- */
.title-wrap { text-align: center; animation: titleDrop .8s cubic-bezier(.34,1.56,.64,1) both; }
@keyframes titleDrop{from{opacity:0;transform:translateY(-40px) scale(.8);}to{opacity:1;transform:translateY(0) scale(1);}}
.title-jp {
  font-family: 'M PLUS Rounded 1c', sans-serif;
  font-weight: 800;
  font-size: clamp(22px, 5.5vw, 40px);
  color: #fff;
  letter-spacing: .08em; line-height: 1.25;
}
.title-sub {
  font-size: 13px; color: rgba(255,255,255,.88);
  margin-top: 5px; letter-spacing: .2em; font-weight: 700;
}

/* ---- マシン ---- */
.machine {
  background: linear-gradient(160deg, #fff9ee 0%, #ffe8b0 100%);
  border-radius: 26px; padding: 30px 22px 22px;
  box-shadow: 0 22px 60px rgba(130,50,0,.38), 0 0 0 4px #FF8C00, 0 0 0 9px #FFD166, inset 0 2px 0 rgba(255,255,255,.9);
  position: relative; animation: machineIn .8s .15s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes machineIn{from{opacity:0;transform:scale(.7);}to{opacity:1;transform:scale(1);}}
.machine::before {
  content: '🌟 SLOT 🌟';
  position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
  background: var(--orange1); color: #fff;
  font-size: 13px; font-weight: 800; padding: 4px 18px; border-radius: 20px;
  white-space: nowrap; box-shadow: 0 3px 10px rgba(0,0,0,.22); letter-spacing: .15em;
  font-family: 'M PLUS Rounded 1c', sans-serif;
}

/* ---- リール群 ---- */
.reels-container { display: flex; gap: 10px; align-items: center; }
.reel-wrap { display: flex; flex-direction: column; align-items: center; gap: 7px; }
.reel-label { font-size: 11px; color: var(--deep); font-weight: 800; letter-spacing: .1em; opacity: .7; }

.reel {
  width: 120px; height: 158px;
  background: linear-gradient(180deg, #FFF5DE 0%, #FFFBF0 50%, #FFF5DE 100%);
  border-radius: 14px; border: 3px solid var(--orange1);
  overflow: hidden; position: relative;
  box-shadow: inset 0 5px 14px rgba(0,0,0,.13), inset 0 -5px 14px rgba(0,0,0,.08), 0 4px 12px rgba(130,50,0,.2);
}
.reel::before, .reel::after {
  content: ''; position: absolute; left: 0; right: 0; height: 46px; z-index: 2; pointer-events: none;
}
.reel::before { top: 0; background: linear-gradient(to bottom, rgba(255,248,220,.97), transparent); }
.reel::after  { bottom: 0; background: linear-gradient(to top, rgba(255,248,220,.97), transparent); }

/* 選択ライン：リール高さ158px の中心 = 79px、アイテム高さ66px → top:46px */
.reel-center-line {
  position: absolute; top: 46px; left: 0; right: 0; height: 66px;
  border-top: 2px solid rgba(255,140,0,.4);
  border-bottom: 2px solid rgba(255,140,0,.4);
  background: rgba(255,200,60,.08);
  z-index: 1; pointer-events: none;
}

.reel-inner { display: flex; flex-direction: column; align-items: center; will-change: transform; }

.reel-item {
  width: 100%; height: 66px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; flex-shrink: 0; padding: 3px; user-select: none;
}

/* 偽物アイテム */
.fake-item { font-size: 30px; line-height: 1; }
.fake-label { font-size: 10px; color: #7a4a00; font-weight: 800; text-align: center; line-height: 1.1; }

/* 割り箸画像 */
.waribashi-img {
  width: 44px; height: 44px;
  object-fit: contain;
  image-rendering: -webkit-optimize-contrast;
}

/* 区切り */
.reel-divider {
  width: 3px; height: 75px;
  background: linear-gradient(to bottom, transparent, var(--orange1), transparent);
  border-radius: 2px; opacity: .45;
}

/* 結果メッセージ */
.result-display {
  text-align: center; min-height: 50px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 4px; margin-top: 14px;
}
.result-message {
  font-family: 'M PLUS Rounded 1c', sans-serif;
  font-size: clamp(13px, 3.5vw, 18px); color: var(--deep); font-weight: 800;
  text-align: center; line-height: 1.4;
  opacity: 0; transform: scale(.8);
  transition: all .4s cubic-bezier(.34,1.56,.64,1);
}
.result-message.show { opacity: 1; transform: scale(1); }
.result-message.jackpot {
  color: #c0392b; font-size: clamp(15px, 4vw, 22px);
  text-shadow: 2px 2px 0 rgba(255,100,0,.25);
}

/* ボタン */
.btn-spin {
  width: 175px; height: 56px; border: none; border-radius: 28px;
  font-family: 'M PLUS Rounded 1c', sans-serif;
  font-size: 20px; font-weight: 800; color: #fff; cursor: pointer;
  background: linear-gradient(135deg, #FF6B00, #FF9A00, #FFB700);
  box-shadow: 0 6px 0 #9B3D00, 0 8px 22px rgba(255,100,0,.4);
  transition: all .12s ease; letter-spacing: .12em;
  position: relative; overflow: hidden; margin-top: 14px;
}
.btn-spin::after {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 50%;
  background: rgba(255,255,255,.22); border-radius: 28px 28px 0 0;
}
.btn-spin:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 #9B3D00,0 4px 10px rgba(255,100,0,.3);}
.btn-spin:disabled{opacity:.6;cursor:not-allowed;transform:translateY(4px);box-shadow:0 2px 0 #9B3D00;}
.btn-spin.spinning{animation:btnPulse .4s ease-in-out infinite alternate;}
@keyframes btnPulse{from{box-shadow:0 6px 0 #9B3D00,0 8px 20px rgba(255,100,0,.4);}to{box-shadow:0 6px 0 #9B3D00,0 8px 32px rgba(255,210,0,.7);}}

/* 紙吹雪 */
.confetti-container{position:fixed;inset:0;pointer-events:none;z-index:999;overflow:hidden;}
.confetti-piece{position:absolute;top:-20px;border-radius:2px;animation:confettiFall linear forwards;}
@keyframes confettiFall{to{transform:translateY(110vh) rotate(720deg);opacity:0;}}

/* リール演出 */
@keyframes reelShake{0%,100%{transform:translateX(0);}25%{transform:translateX(-2px);}75%{transform:translateX(2px);}}
.reel.spinning-anim{animation:reelShake .14s linear infinite;}
@keyframes winGlow{
  0%{box-shadow:inset 0 5px 14px rgba(0,0,0,.13),inset 0 -5px 14px rgba(0,0,0,.08),0 4px 12px rgba(130,50,0,.2);}
  50%{box-shadow:inset 0 5px 14px rgba(0,0,0,.13),inset 0 -5px 14px rgba(0,0,0,.08),0 0 30px #FFD700,0 0 55px #FF8C00;}
  100%{box-shadow:inset 0 5px 14px rgba(0,0,0,.13),inset 0 -5px 14px rgba(0,0,0,.08),0 4px 12px rgba(130,50,0,.2);}
}
.reel.win-glow{animation:winGlow .5s ease-in-out 4;}
</style>
</head>

  <div class="bg-circle"></div><div class="bg-circle"></div><div class="bg-circle"></div>
  <div class="bg-circle"></div><div class="bg-circle"></div>

<div class="confetti-container" id="confetti"></div>

<div class="container">

      <div class="reel-wrap">

      <button class="btn-spin" id="spinBtn" onclick="spin()">🎰 スピン！</button>

</div>

  { emoji:'🌸', label:'お花' },
  { emoji:'🍀', label:'四つ葉' },
  { emoji:'🎨', label:'アート' },
];

function makeWaribashiHTML() {
  return `<img class="waribashi-img" src="${WARIBASHI_SRC}" alt="割り箸">
<div class="fake-label">割り箸</div>`;
}
function makeDecoyHTML(item) {
  return `<div class="fake-item">${item.emoji}</div><div class="fake-label">${item.label}</div>`;
}

// ---- リールデータ構築：偽物6個＋割り箸1個 ----
function buildReelData() {
  const shuffled = [...DECOY_POOL].sort(() => Math.random() - 0.5).slice(0, 6);
  const insertAt = Math.floor(Math.random() * (shuffled.length + 1));
  const items = [...shuffled];
  items.splice(insertAt, 0, { type: 'waribashi' });
  return { items, waribashiIndex: insertAt };
}

let reelData = [buildReelData(), buildReelData(), buildReelData()];

const ITEM_H = 66;
// リール高さ158px。中央セルをラインに合わせるオフセット = 46px（上のグラデ幅分）
// リール内 inner の Y = -(loopH + waribashiIndex * ITEM_H) で
// waribashiIndex番目のセルの「先頭」がY=46pxに来る。
// セルの中心は先頭+33px → 46+33=79 = リール中心。OK。

function buildReelDOM(ri) {
  const inner = document.getElementById(`inner${ri}`);
  const { items } = reelData[ri];
  let html = '';
  for (let loop = 0; loop < 3; loop++) {
    items.forEach(item => {
      if (item.type === 'waribashi') {
        html += `<div class="reel-item">${makeWaribashiHTML()}</div>`;
      } else {
        html += `<div class="reel-item">${makeDecoyHTML(item)}</div>`;
      }
    });
  }
  inner.innerHTML = html;
  const loopH = items.length * ITEM_H;
  // 初期位置: 1周目先頭（=2周目相当の位置）
  inner.style.transform = `translateY(-${loopH}px)`;
}

for (let i = 0; i < 3; i++) buildReelDOM(i);

// ---- 効果音 ----
let audioCtx = null;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playSound(type) {
  try {
    const ctx = getAudio();
    if (type === 'spin') {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination); o.type = 'sawtooth';
      o.frequency.setValueAtTime(200, ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.12);
      g.gain.setValueAtTime(0.13, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
      o.start(); o.stop(ctx.currentTime + 0.18);
    } else if (type === 'stop') {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination); o.type = 'square';
      o.frequency.setValueAtTime(550, ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(280, ctx.currentTime + 0.09);
      g.gain.setValueAtTime(0.18, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.13);
      o.start(); o.stop(ctx.currentTime + 0.13);
    } else if (type === 'tick') {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination); o.type = 'sine'; o.frequency.value = 750;
      g.gain.setValueAtTime(0.07, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.06);
      o.start(); o.stop(ctx.currentTime + 0.06);
    } else if (type === 'win') {
      [[523,0],[659,.1],[784,.2],[1047,.32],[784,.46],[1047,.58]].forEach(([f,d]) => {
        const o=ctx.createOscillator(),g=ctx.createGain();
        o.connect(g);g.connect(ctx.destination);o.type='triangle';o.frequency.value=f;
        g.gain.setValueAtTime(0,ctx.currentTime+d);
        g.gain.linearRampToValueAtTime(0.22,ctx.currentTime+d+0.02);
        g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+d+0.16);
        o.start(ctx.currentTime+d);o.stop(ctx.currentTime+d+0.2);
      });
    } else if (type === 'jackpot') {
      [[523,0],[659,.1],[784,.2],[1047,.3],[784,.46],[1047,.56],[1319,.66],[1047,.8],[1319,.9],[1568,1.0]].forEach(([f,d]) => {
        const o=ctx.createOscillator(),g=ctx.createGain();
        o.connect(g);g.connect(ctx.destination);o.type='sine';o.frequency.value=f;
        g.gain.setValueAtTime(0,ctx.currentTime+d);
        g.gain.linearRampToValueAtTime(0.28,ctx.currentTime+d+0.03);
        g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+d+0.22);
        o.start(ctx.currentTime+d);o.stop(ctx.currentTime+d+0.26);
      });
    }
  } catch(e){}
}

// ---- スピン ----
let isSpinning = false;

function spin() {
  if (isSpinning) return;
  isSpinning = true;

  const btn = document.getElementById('spinBtn');
  btn.disabled = true;
  btn.classList.add('spinning');
  const msg = document.getElementById('resultMsg');
  msg.classList.remove('show','jackpot');
  msg.textContent = '🎰 回転中…';
  playSound('spin');

  const spinDurations = [1500, 2100, 2700];
  let stopped = [false, false, false];

  for (let ri = 0; ri < 3; ri++) {
    (function(reelIndex) {
      const inner = document.getElementById(`inner${reelIndex}`);
      const { items, waribashiIndex } = reelData[reelIndex];
      const loopH = items.length * ITEM_H;

      // 目標Y: 2周目の割り箸セル先頭がY=46pxの位置になるtranslateY値
      // inner.translateY = -(loopH + waribashiIndex * ITEM_H)
      // すると セル先頭 = -(-(loopH + waribashiIndex*ITEM_H)) + 0 = loopH + waribashiIndex*ITEM_H ... 違う
      // innerのtranslateY=-Tのとき、セルiの画面上のtopは -T + i*ITEM_H
      // セル top = 46px になるには: -T + waribashiIndex*ITEM_H = 46
      // → T = waribashiIndex*ITEM_H - 46
      // 2周目の割り箸 = loopH + waribashiIndex
      // T = loopH + waribashiIndex*ITEM_H - 46
      const targetY = loopH + waribashiIndex * ITEM_H - 46;

      let currentY = loopH; // 初期位置
      let speed = 15;
      let slowingDown = false;
      const startTime = performance.now();

      document.getElementById(`reel${reelIndex}`).classList.add('spinning-anim');

      function frame(now) {
        const elapsed = now - startTime;
        if (elapsed > spinDurations[reelIndex] - 700 && !slowingDown) {
          slowingDown = true;
          playSound('tick');
        }
        if (slowingDown) {
          let diff = targetY - currentY;
          if (diff < -loopH / 2) diff += loopH;
          if (Math.abs(diff) <= 1.5 || elapsed > spinDurations[reelIndex] + 400) {
            // 停止 → そのまま固定（リビルドしない）
            currentY = targetY;
            inner.style.transform = `translateY(-${currentY}px)`;
            document.getElementById(`reel${reelIndex}`).classList.remove('spinning-anim');
            stopped[reelIndex] = true;
            playSound('stop');
            if (stopped.every(s => s)) showResult();
            return;
          }
          speed = Math.max(1.5, speed * 0.87);
          currentY += Math.sign(diff) * Math.min(speed, Math.abs(diff));
        } else {
          currentY += 15;
          if (currentY >= loopH * 2) currentY -= loopH;
        }
        inner.style.transform = `translateY(-${currentY}px)`;
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    })(ri);
  }
}

const MESSAGES = [
  '🥢 やっぱり割り箸！今日はテイクアウトの日',
  '🥢 割り箸GET！お弁当タイムが待ってる✨',
  '🥢 今日も割り箸！外食の予感がする〜',
  '🥢 割り箸が必要！どこかへ食べに行こう',
  '🥢 導き出された答え…それは割り箸！',
  '🥢 宇宙の意志が告げる…割り箸を使え！',
  '🎊 大当たり！割り箸で最高の1日を！',
];
const JACKPOT_MSG = '🎊🥢 JACKPOT!! 割り箸は今日もあなたの味方!! 🥢🎊';

function showResult() {
  const btn = document.getElementById('spinBtn');
  btn.disabled = false;
  btn.classList.remove('spinning');
  isSpinning = false;

  const msg = document.getElementById('resultMsg');
  const isJackpot = Math.random() < 0.25;

  if (isJackpot) {
    msg.textContent = JACKPOT_MSG;
    msg.classList.add('show','jackpot');
    playSound('jackpot');
    launchConfetti(90);
    for (let i = 0; i < 3; i++) {
      const r = document.getElementById(`reel${i}`);
      r.classList.add('win-glow');
      setTimeout(() => r.classList.remove('win-glow'), 2200);
    }
  } else {
    msg.textContent = MESSAGES[Math.floor(Math.random() * MESSAGES.length)];
    msg.classList.add('show');
    playSound('win');
    launchConfetti(35);
  }

  // スピンボタンが押されるまで割り箸は止まったまま
  // 次回スピン時にリールをリビルド（ボタン押下時に実行）
}

// スピンボタン本体でリビルドを行う
const origSpin = spin;
spin = function() {
  // リビルド（前回の結果から新しい配置へ）
  reelData = [buildReelData(), buildReelData(), buildReelData()];
  for (let i = 0; i < 3; i++) buildReelDOM(i);
  origSpin();
};

// ---- 紙吹雪 ----
function launchConfetti(count) {
  const container = document.getElementById('confetti');
  const colors = ['#FF8C00','#FFD700','#FF4444','#00CC66','#FF69B4','#00BFFF','#FF6347','#fff'];
  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.left = Math.random() * 100 + 'vw';
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      el.style.width  = (Math.random() * 10 + 6) + 'px';
      el.style.height = (Math.random() * 10 + 6) + 'px';
      el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      const dur = Math.random() * 1600 + 900;
      el.style.animationDuration = dur + 'ms';
      container.appendChild(el);
      setTimeout(() => el.remove(), dur + 100);
    }, i * 28);
  }
}

window.addEventListener('load', () => {
  document.getElementById('resultMsg').classList.add('show');
});
